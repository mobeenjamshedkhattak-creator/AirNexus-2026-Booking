const root=document.getElementById('app'),modal=document.getElementById('modal');
let statusText='Opening…',statusKind='local';
const config=window.APP_CONFIG||{};
const store=new CampusStore(config,(message,kind)=>{statusText=message;statusKind=kind;document.querySelectorAll('[data-save-status]').forEach(el=>{el.className='save-status '+kind;el.innerHTML=`<span class="dot"></span>${esc(message)}`;});});
let campus=null,selected=null,view='map',tab='events',query='',category='',date='',labels=true,reference=false,mode='select',drawing=[],zoom=1,pan={x:0,y:0},drag=null,history={e9:[],h11:[]},toastTimer=null,modalContext={},formDirty=false,polling=false;
const current=()=>store.doc(campus),selectedZone=()=>current()?.zones.find(z=>z.id===selected);
const saveBadge=()=>`<button data-action="sync" data-save-status class="save-status ${statusKind}" title="Save status and recovery"><span class="dot"></span>${esc(statusText)}</button>`;
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),4500);}
function change(mutator){const before=clone(current());mutator(current());history[campus].push(before);if(history[campus].length>30)history[campus].shift();store.changed(campus);render();}
function resetMap(){zoom=1;pan={x:0,y:0};mode='select';drawing=[];}
function choose(id){campus=id;selected=null;query='';category='';tab='events';view='map';reference=false;resetMap();render();window.scrollTo(0,0);}
function visibleZones(){const q=query.toLowerCase();return current().zones.filter(z=>(!category||z.category===category)&&(!q||z.name.toLowerCase().includes(q)||areaEvents(current(),z.id,date,query).length));}
function render(){
  const active=document.activeElement;const focusId=active?.id;const start=active?.selectionStart,end=active?.selectionEnd;const listScroll=document.querySelector('.area-list')?.scrollTop;
  if(store.cloud&&!store.loaded){renderLogin();return;}
  if(!campus)renderHome();else renderWorkspace();
  if(focusId){const next=document.getElementById(focusId);if(next){next.focus({preventScroll:true});try{next.setSelectionRange(start,end);}catch{}}}
  if(listScroll)document.querySelector('.area-list')?.scrollTo(0,listScroll);
}
function renderHome(){
  root.innerHTML=`<main class="home"><nav class="home-nav">${brand()}<div class="home-nav-right">${saveBadge()}<button class="btn small" data-action="help">${icon('help')}Quick guide</button>${store.cloud?`<button class="icon-btn" data-action="logout" title="Sign out">${icon('logout')}</button>`:''}</div></nav><section class="hero"><div><div class="eyebrow">AIR UNIVERSITY  /  OLYMPIAD OPERATIONS</div><h1>Every event.<br>In the <em>right place.</em></h1><p>Your two campuses, connected by one plan. Colour the spaces, organise the rooms and bring AirNexus to life.</p></div><aside class="hero-aside"><strong>02 <span class="muted">/ campuses</span></strong><p>Start with a campus.<br>Build a map everyone can follow.</p></aside></section><section class="campus-grid" aria-label="Choose your campus">${Object.values(CAMPUSES).map((c,i)=>{const d=store.doc(c.id);return `<article class="campus-card"><div class="campus-art ${c.id}"><span class="card-tag">${c.eyebrow}</span>${svgMarkup(c.id,d,{labels:false})}</div><div class="card-body"><div class="card-top"><h2>${c.name}</h2><span class="round-arrow">${icon('arrow')}</span></div><p>${c.description}</p><div class="card-bottom"><span>${String(d.zones.length).padStart(2,'0')} COLOURED AREAS</span><span>·</span><span>${d.events.filter(e=>e.status!=='Cancelled').length} EVENTS PLANNED</span></div></div><button class="card-open" data-action="campus" data-id="${c.id}" aria-label="Open ${c.name}">Open ${c.name}</button></article>`;}).join('')}</section>${!store.cloud?`<div class="local-banner">${icon('cloud')} <strong>Local preview.</strong> Edits are saved in this browser. Connect Supabase during deployment for shared, lasting saves. No real events or room names have been prefilled.</div>`:''}<footer class="home-footer"><div class="capabilities"><span>${icon('pin')}Editable areas</span><span>${icon('room')}Rooms & bookings</span><span>${icon('download')}PDF & offline HTML</span></div><span>AIRNEXUS CAMPUS ATLAS · ISLAMABAD</span></footer></main>`;
}
function renderLogin(error=''){
  root.innerHTML=`<main class="login-shell"><section class="login-art">${brand()}${svgMarkup('e9',freshDocument('e9'),{labels:false})}<div><div class="eyebrow">AIR UNIVERSITY / AIRNEXUS</div><h1>A place for<br><em>every moment.</em></h1><p>Two campuses. Colourful spaces. A single, shared plan for your Olympiad.</p></div><footer class="eyebrow">CAMPUS ATLAS · ORGANIZER ACCESS</footer></section><section class="login-main"><div class="login-box"><div class="eyebrow muted">WELCOME TO THE OPERATIONS DESK</div><h2>Let’s get things moving.</h2><p>Sign in with the organizer email and password created in your Supabase project.</p><form id="login-form"><label class="field">Email address<input name="email" type="email" required autocomplete="username" placeholder="organizer@au.edu.pk"></label><label class="field">Password<input name="password" type="password" required autocomplete="current-password" minlength="6" placeholder="Your password"></label><div class="error-box" id="login-error">${esc(error)}</div><button class="btn primary full" type="submit">${icon('lock')}Sign in to Campus Atlas</button></form><p style="margin-top:24px;font-size:10px">Access is limited to approved organizers. Your administrator can add accounts under Authentication → Users and approve them with add-organizer.sql. No custom email server is required.</p><button class="btn small full" data-action="help">${icon('help')}Setup & first-use help</button></div></section></main>`;
}
function areaList(){return visibleZones().map(z=>{const n=areaEvents(current(),z.id,date).filter(e=>e.status!=='Cancelled').length;return `<button class="area-item ${selected===z.id?'active':''}" data-action="area" data-id="${esc(z.id)}"><i class="swatch" style="background:${z.color}"></i><span class="name">${esc(z.name)}</span>${n?`<span class="num">${n}</span>`:''}</button>`;}).join('')||'<div class="empty">No areas match.</div>';}
function renderWorkspace(){
  const c=CAMPUSES[campus],d=current();if(selected&&!selectedZone())selected=null;
  root.innerHTML=`<header class="topbar"><div class="topbar-left">${brand()}<div class="top-separator"></div><div class="breadcrumb"><span>Olympiad operations</span>${icon('chevron')}<b>${c.name}</b></div></div><div class="topbar-actions">${saveBadge()}<button class="btn small" data-action="exports">${icon('download')}<span class="export-label">Export plan</span></button><button class="icon-btn" data-action="help" title="Quick guide">${icon('help')}</button>${store.cloud?`<button class="icon-btn" data-action="logout" title="Sign out">${icon('logout')}</button>`:''}</div></header><div class="workspace"><aside class="sidebar"><div><button class="campus-switch full" data-action="home">${c.name}${icon('down')}</button><div class="side-meta">${c.district}</div></div><div class="search-box">${icon('search')}<input id="area-search" data-input="query" placeholder="Find an area or event" value="${esc(query)}" aria-label="Search areas and events"></div><div><div class="section-title"><span>AREA DIRECTORY</span><button data-action="draw" class="icon-btn" title="Draw a new area">${icon('plus')}</button></div><div class="area-list">${areaList()}</div></div><button class="btn small full" data-action="draw">${icon('draw')}Draw a new area</button><div class="side-bottom"><span class="eyebrow" style="font-size:8px">ONE CAMPUS. ONE CLEAR PLAN.</span><br>Changes save as you work.<br><button data-action="home">Switch campus</button> · <button data-action="sync">Save & recovery</button></div></aside><main class="main-panel"><div class="view-heading"><div><div class="eyebrow">YOUR OLYMPIAD, MAPPED OUT</div><h1><button class="home-title-edit" data-action="title" title="Rename this plan">${esc(d.title)}</button></h1></div><div class="tabs"><button data-action="view" data-id="map" class="${view==='map'?'active':''}">${icon('map')}Map</button><button data-action="view" data-id="schedule" class="${view==='schedule'?'active':''}">${icon('calendar')}Schedule</button></div></div><div class="mobile-areas"><select data-input="area" aria-label="Select area"><option value="">All areas</option>${d.zones.map(z=>`<option value="${esc(z.id)}" ${selected===z.id?'selected':''}>${esc(z.name)}</option>`).join('')}</select><div class="search-box">${icon('search')}<input id="mobile-search" data-input="query" placeholder="Find area / event" value="${esc(query)}" aria-label="Search areas and events"></div></div><div class="filters"><div class="filter-chips">${['',...CATEGORIES].map(cat=>`<button data-action="category" data-id="${cat}" class="chip ${category===cat?'active':''}">${cat==='Sports'?'<i class="dot" style="background:#e5b24c"></i>':''}${cat||'All areas'}</button>`).join('')}</div><div class="date-filter"><input aria-label="Filter event date" type="date" data-input="date" value="${date}"><button data-action="clear-date" title="Show all dates">${date?'Clear':'All dates'}</button></div></div>${view==='map'?mapShell():scheduleMarkup()}<div class="map-note"><span>${view==='map'?'Click an area to explore its rooms and events.':'Tentative and confirmed bookings reserve the space.'}</span><span>ALL TIMES: PKT (UTC+5)</span></div></main><aside class="detail-panel" aria-label="Area details">${selectedZone()?detailMarkup():overviewMarkup()}</aside></div>`;
  if(view==='map')renderMap();
}
function mapShell(){return `${mode==='draw'?`<div class="mode-banner"><span><strong>Draw an area:</strong> click its corners on the map. Add at least 3 points.</span><div><button class="btn small" data-action="draw-back" ${drawing.length?'':'disabled'}>Undo point</button> <button class="btn small primary" data-action="draw-finish" ${drawing.length>=3?'':'disabled'}>Finish</button> <button class="icon-btn" data-action="select-mode" title="Cancel drawing">${icon('x')}</button></div></div>`:mode==='edit'?`<div class="mode-banner"><span>Drag a corner to reshape the selected area. Drag the dark label dot to move its name.</span><button class="btn small" data-action="select-mode">Done</button></div>`:''}<div class="map-frame"><div class="map-viewport ${mode==='pan'?'pan':mode==='draw'?'draw':''}" id="map-viewport"><div class="map-layer" id="map-layer"></div></div><div class="map-toolbar"><button class="icon-btn ${mode==='select'?'active':''}" data-action="select-mode" title="Select areas">${icon('pin')}</button><button class="icon-btn ${mode==='pan'?'active':''}" data-action="pan-mode" title="Pan / move the map">${icon('move')}</button><div class="tool-divider"></div><button class="tool-label ${reference?'active':''}" data-action="reference" title="Compare with the uploaded screenshot">${icon('layers')}${reference?'Original':'Clean map'}</button><button class="icon-btn ${labels?'':'active'}" data-action="labels" title="Show or hide labels">${icon('type')}</button><div class="tool-divider"></div><button class="icon-btn ${mode==='draw'?'active':''}" data-action="draw" title="Draw new area">${icon('draw')}</button><button class="icon-btn" data-action="shape" title="Reshape selected area" ${selected?'':'disabled'}>${icon('edit')}</button><button class="icon-btn" data-action="undo" title="Undo last edit" ${history[campus].length?'':'disabled'}>${icon('undo')}</button></div>${reference?`<span class="reference-attribution">${campus==='h11'?'User-supplied Google Earth screenshot · Google attribution retained in image.':'User-supplied OpenStreetMap screenshot · © OpenStreetMap contributors.'}</span>`:''}<div class="map-bottom"><span>${mode==='pan'?'Drag the canvas to pan.':'COLOURED AREAS · CLICK TO EXPLORE'}</span><div class="zoom"><button class="icon-btn" data-action="zoom-out" title="Zoom out">${icon('minus')}</button><b id="zoom-value">${Math.round(zoom*100)}%</b><button class="icon-btn" data-action="zoom-in" title="Zoom in">${icon('plus')}</button><button class="icon-btn" data-action="fit" title="Fit map to view">${icon('fit')}</button></div></div></div>`;}
function renderMap(){const layer=document.getElementById('map-layer');if(!layer)return;layer.innerHTML=svgMarkup(campus,current(),{selected,labels,reference,category,date,query});const svg=layer.querySelector('svg');
  if(mode==='edit'&&selectedZone()){const z=selectedZone();svg.insertAdjacentHTML('beforeend',z.points.map((p,i)=>`<circle class="vertex" data-handle="${i}" cx="${p[0]}" cy="${p[1]}" r="6"/>`).join('')+`<circle class="label-handle" data-handle="label" cx="${z.label[0]}" cy="${z.label[1]}" r="6"><title>Move area name</title></circle>`);}
  if(drawing.length)svg.insertAdjacentHTML('beforeend',`<polygon class="drawing-preview" points="${drawing.map(p=>p.join(',')).join(' ')}"/>`+drawing.map(p=>`<circle class="draw-point" cx="${p[0]}" cy="${p[1]}" r="4"/>`).join(''));
  transformMap();}
function transformMap(){const layer=document.getElementById('map-layer');if(layer)layer.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;const z=document.getElementById('zoom-value');if(z)z.textContent=Math.round(zoom*100)+'%';}
function overviewMarkup(){const d=current(),active=d.events.filter(e=>e.status!=='Cancelled'),rooms=d.zones.reduce((n,z)=>n+z.rooms.length,0),need=d.zones.filter(z=>!z.verified).length;return `<div class="detail-kicker">CAMPUS AT A GLANCE ${icon('map')}</div><div class="summary-illustration">${icon('map')}</div><h2 class="summary-title">Make room for<br>something great.</h2><p class="summary-copy">Select any coloured area to rename it, add rooms and plan what happens there.</p><div class="detail-stats"><div class="detail-stat"><strong>${d.zones.length}</strong><span>Mapped areas</span></div><div class="detail-stat"><strong>${active.length}</strong><span>Active bookings</span></div><div class="detail-stat"><strong>${rooms}</strong><span>Rooms added</span></div><div class="detail-stat"><strong>${d.zones.filter(z=>areaEvents(d,z.id,date).filter(e=>e.status!=='Cancelled').length).length}</strong><span>Areas in use${date?' · selected day':''}</span></div></div><div class="mini-bars">${d.zones.map(z=>`<i style="background:${z.color}"></i>`).join('')}</div>${need?`<div class="verify-note">${need} area names need confirmation. Their shapes follow visible features in your screenshots. Check names and boundaries before sharing.</div>`:''}<button class="btn primary full" data-action="event">${icon('plus')}Create an event</button><div class="info-actions"><button class="btn small" data-action="draw">${icon('draw')}Draw a new area</button><button class="btn small" data-action="home">${icon('back')}Choose another campus</button></div>`;}
function detailMarkup(){const z=selectedZone(),ev=areaEvents(current(),z.id,date,query);return `<div class="detail-kicker">AREA DETAILS<button class="icon-btn" data-action="deselect" title="Close area details">${icon('x')}</button></div><div class="zone-preview"><svg viewBox="${Math.min(...z.points.map(p=>p[0]))-15} ${Math.min(...z.points.map(p=>p[1]))-15} ${Math.max(...z.points.map(p=>p[0]))-Math.min(...z.points.map(p=>p[0]))+30} ${Math.max(...z.points.map(p=>p[1]))-Math.min(...z.points.map(p=>p[1]))+30}" style="width:80%;height:94%"><polygon points="${z.points.map(p=>p.join(',')).join(' ')}" fill="${z.color}"/></svg></div><h2 class="detail-title">${esc(z.name)}</h2><div class="detail-category"><i class="swatch" style="background:${z.color};width:8px;height:8px"></i>${z.category}<span>·</span>${CAMPUSES[campus].name}<button class="icon-btn" data-action="edit-area" title="Edit area name and colour">${icon('edit')}</button></div>${!z.verified?'<div class="verify-note">Provisional name. Rename this area and mark it confirmed after checking the campus.</div>':''}<div class="detail-stats"><div class="detail-stat"><strong>${ev.filter(e=>e.status!=='Cancelled').length}</strong><span>Events${date?' on this date':''}</span></div><div class="detail-stat"><strong>${z.rooms.length}</strong><span>Rooms / spaces</span></div></div><div class="detail-tabs">${['events','rooms','details'].map(t=>`<button class="${tab===t?'active':''}" data-action="detail-tab" data-id="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${tab==='events'?`${ev.length?ev.map(e=>eventCard(e)).join(''):`<div class="empty">${icon('calendar')}<p>No events ${date?'on this date':'here yet'}.<br>Your next great moment starts here.</p></div>`}<button class="btn primary full" data-action="event">${icon('plus')}Add an event</button>`:tab==='rooms'?`${z.rooms.length?z.rooms.map(r=>`<div class="room-row"><div><strong>${esc(r.name)}</strong><small>${r.capacity?r.capacity+' people':'Capacity not set'}</small></div><div class="room-actions"><button class="icon-btn" data-action="room-event" data-id="${esc(r.id)}" title="Book this room">${icon('plus')}</button><button class="icon-btn" data-action="edit-room" data-id="${esc(r.id)}" title="Edit room">${icon('edit')}</button><button class="icon-btn" data-action="delete-room" data-id="${esc(r.id)}" title="Delete room">${icon('trash')}</button></div></div>`).join(''):'<div class="empty">'+icon('room')+'<p>Add actual room names or named spaces.<br>Rooms can host separate events.</p></div>'}<button class="btn full" data-action="room" style="margin-top:16px">${icon('plus')}Add room / space</button>`:`<p class="detail-notes">${esc(z.notes||'No area notes yet. Add access instructions, floor information or other useful details.')}</p><div class="info-actions"><button class="btn small" data-action="edit-area">${icon('edit')}Edit area details</button><button class="btn small" data-action="shape">${icon('draw')}Reshape / move label</button><button class="btn small danger" data-action="delete-area">${icon('trash')}Delete this area</button></div>`}`;}
function eventCard(e){const z=current().zones.find(z=>z.id===e.areaId),r=z.rooms.find(r=>r.id===e.roomId);return `<button class="event-card" data-action="edit-event" data-id="${esc(e.id)}"><span class="event-time"><span>${clock(e.start)} – ${clock(e.end)}</span><span>${prettyDate(e.date)}</span></span><strong>${esc(e.title)}</strong><small>${esc(r?.name||'Whole area')} · ${e.attendees||0} attendees</small><span class="status-tag ${e.status}" style="margin-top:9px">${e.status}</span></button>`;}
function scheduleMarkup(){const ev=areaEvents(current(),selected,date,query).filter(e=>!category||current().zones.find(z=>z.id===e.areaId)?.category===category),active=ev.filter(e=>e.status!=='Cancelled');return `<div class="schedule-summary"><div class="summary-box"><strong>${active.length}</strong><span>ACTIVE BOOKINGS</span></div><div class="summary-box"><strong>${new Set(active.map(e=>e.areaId)).size}</strong><span>AREAS IN USE</span></div><button class="btn primary" data-action="event">${icon('plus')}Add event</button></div><div class="schedule"><div class="schedule-head"><span>DATE / TIME</span><span>EVENT</span><span>SPACE</span><span>STATUS</span></div>${ev.length?ev.map(e=>{const z=current().zones.find(z=>z.id===e.areaId),r=z.rooms.find(r=>r.id===e.roomId);return `<button class="schedule-row" data-action="edit-event" data-id="${esc(e.id)}"><span>${prettyDate(e.date)}<small>${e.start} – ${e.end}</small></span><span><strong>${esc(e.title)}</strong><small>${esc(e.organizer||'Organizer not set')}</small></span><span class="schedule-area"><i class="swatch" style="background:${z.color}"></i><span>${esc(z.name)}<small>${esc(r?.name||'Whole area')}</small></span></span><span class="status-tag ${e.status}">${e.status}</span></button>`;}).join(''):'<div class="empty" style="padding:60px 20px">'+icon('calendar')+'<p>No events match this view.<br>Add an event or clear your filters.</p></div>'}</div>${selected?`<button class="btn small" data-action="deselect" style="margin-top:12px">Show all areas</button>`:''}`;}

function openModal(title,subtitle,body,footer='',form=''){formDirty=false;modalContext.form=form;modal.innerHTML=`${form?`<form id="${form}">`:''}<div class="modal-head"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div><button class="icon-btn" type="button" data-action="close" aria-label="Close dialog">${icon('x')}</button></div><div class="modal-body">${body}<div id="form-error" class="error-box"></div></div>${footer?`<div class="modal-footer">${footer}</div>`:''}${form?'</form>':''}`;if(!modal.open)modal.showModal();}
function closeModal(force=false){if(formDirty&&!force){if(!confirm('Discard the unsaved changes in this form?'))return;}modal.close();formDirty=false;modalContext={};}
const formButtons=(label,extra='')=>`${extra||'<span></span>'}<div><button type="button" class="btn" data-action="close">Cancel</button><button class="btn primary" type="submit">${icon('check')}${label}</button></div>`;
function areaModal(newPoints=null){const z=selectedZone();modalContext={points:newPoints};openModal(newPoints?'Make this space yours.':'Edit area details','The name, colour and notes appear on the map and in your exports.',`<label class="field">Area / block name<input name="name" required maxlength="80" value="${newPoints?'':esc(z.name)}" placeholder="e.g. Sports Complex"></label><div class="form-grid"><label class="field">Category<select name="category">${CATEGORIES.map(c=>`<option ${!newPoints&&z.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">Area colour<input name="color" id="area-color" type="color" value="${newPoints?PALETTE[current().zones.length%PALETTE.length]:z.color}"></label></div><div class="color-options">${PALETTE.map(c=>`<button class="color-option" type="button" data-action="color" data-id="${c}" style="background:${c}" title="Use ${c}"></button>`).join('')}</div><label class="field"><input name="verified" type="checkbox" ${!newPoints&&z.verified?'checked':''}>I have confirmed this name and location</label><label class="field">Area notes<textarea name="notes" maxlength="2000" placeholder="Floor details, access instructions…">${newPoints?'':esc(z.notes)}</textarea></label>`,formButtons(newPoints?'Create area':'Save area'),'area-form');}
function roomModal(id=null){const z=selectedZone();const r=z?.rooms.find(r=>r.id===id);modalContext={roomId:id};openModal(r?'Edit room / space':'Add a room / space',esc(z.name),`<label class="field">Room / space name<input name="name" required maxlength="80" value="${esc(r?.name||'')}" placeholder="e.g. Room A-101, Main Hall, Court 1"></label><label class="field">Capacity (optional)<input name="capacity" type="number" min="1" max="100000" step="1" value="${r?.capacity||''}" placeholder="e.g. 50"><span class="hint">Bookings with more attendees than this capacity will be stopped.</span></label>`,formButtons('Save room'),'room-form');}
function roomOptions(areaId,roomId=''){const z=current().zones.find(z=>z.id===areaId);return `<option value="">Whole area (reserves all rooms)</option>${z?.rooms.map(r=>`<option value="${esc(r.id)}" ${r.id===roomId?'selected':''}>${esc(r.name)}${r.capacity?' · '+r.capacity+' people':''}</option>`).join('')||''}`;}
function eventModal(id=null,roomId=''){if(!current().zones.length)return toast('Draw an area before adding events.');const e=current().events.find(e=>e.id===id);const areaId=e?.areaId||selected||current().zones[0].id;modalContext={eventId:id};openModal(e?'Edit your event':'Plan a new moment.','Book an entire area or choose a room. All times are Pakistan Standard Time.',`<label class="field">Event name<input name="title" required maxlength="120" value="${esc(e?.title||'')}" placeholder="e.g. Debate final, Badminton singles"></label><div class="form-grid"><label class="field">Area / block<select name="areaId" id="event-area">${current().zones.map(z=>`<option value="${esc(z.id)}" ${z.id===areaId?'selected':''}>${esc(z.name)}</option>`).join('')}</select></label><label class="field">Room / space<select name="roomId" id="event-room">${roomOptions(areaId,e?.roomId||roomId)}</select></label></div><div class="form-grid"><label class="field">Date<input name="date" type="date" required value="${e?.date||date||today()}"></label><label class="field">Status<select name="status">${STATUSES.map(s=>`<option ${e?.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="field">Start time (PKT)<input name="start" type="time" required value="${e?.start||'09:00'}"></label><label class="field">Finish time (PKT)<input name="end" type="time" required value="${e?.end||'10:00'}"></label><label class="field">Organizer / society<input name="organizer" maxlength="120" value="${esc(e?.organizer||'')}" placeholder="e.g. AirNexus team"></label><label class="field">Expected attendees<input name="attendees" type="number" min="0" max="100000" step="1" value="${e?.attendees||0}"></label></div><label class="field">Notes<textarea name="notes" maxlength="2000" placeholder="Requirements, instructions, setup details…">${esc(e?.notes||'')}</textarea></label><div class="info-note">Confirmed and tentative bookings reserve the space. Cancelled events stay in the schedule without blocking it.</div>`,formButtons('Save event',e?`<button class="btn small danger" type="button" data-action="delete-event" data-id="${esc(e.id)}">${icon('trash')}Delete</button>`:''),'event-form');}
function exportModal(){openModal('Take your plan with you.','Choose an export. PDF includes the selected campus and date filter.',`<button class="export-option" data-action="export-pdf">${icon('file')}<span><strong>Download campus PDF</strong><small>Coloured map, area directory and complete event schedule.<br>${CAMPUSES[campus].name} · ${prettyDate(date)}</small></span></button><button class="export-option" data-action="export-html">${icon('map')}<span><strong>Download editable HTML</strong><small>Both campuses in one offline editor. Open it in your browser; no sign-in needed. It contains the current plan data.</small></span></button><button class="export-option" data-action="export-json">${icon('download')}<span><strong>Back up both campuses (.json)</strong><small>Restore names, colours, boundaries, rooms and bookings later.</small></span></button><button class="export-option" data-action="export-svg">${icon('layers')}<span><strong>Download clean map (.svg)</strong><small>Scalable, editable vector artwork of this campus.</small></span></button><button class="export-option" data-action="import">${icon('upload')}<span><strong>Restore an AirNexus backup</strong><small>Preview a JSON backup before replacing the current plan.</small></span></button>`);}
function helpModal(){openModal('A little guide. A lot of possibility.','Your first five minutes in Campus Atlas.',`<ol class="info-list"><li><strong>Choose E-9 or H-11.</strong> Every coloured shape is an editable area.</li><li><strong>Confirm the map.</strong> Click “Clean map” to compare the original screenshot. Select an area → edit its name, colour and category.</li><li><strong>Add rooms.</strong> Open an area → Rooms → Add room / space. Use your actual room names.</li><li><strong>Book events.</strong> Add name, date and times. Pick a room or reserve the whole area.</li><li><strong>Correct boundaries.</strong> Select an area → pencil in the map toolbar → drag its corner points. The dark dot moves the name. Use Draw to add missing areas.</li><li><strong>Save and export.</strong> The top indicator confirms saving. Export gives PDF, editable offline HTML, SVG and backup JSON.</li></ol><div class="info-note">The map is a schematic traced from the supplied screenshots. Road routes and unlabeled buildings are approximate. Room positions, floors and room names were not available in the images. Confirm area names and boundaries before issuing an official event map.</div><p><strong>Cloud setup:</strong> Follow START-HERE.html in your download. Run supabase/setup.sql, create an Auth user, approve that email in add-organizer.sql, then add the two Supabase values in Vercel.</p><p><strong>Daily work:</strong> Supabase stores the plan data. You do not need to change GitHub or redeploy Vercel after editing an event. Other signed-in editors receive the latest saved plan automatically, normally within 20 seconds.</p><p><strong>Offline HTML:</strong> It is a separate editor saved on your computer. It does not connect to your cloud project. Download a JSON backup from it and use Restore in the deployed portal to transfer its edits.</p>`);}
function syncModal(){const isCloud=store.cloud;openModal(isCloud?'Your plan, saved.':'Local draft storage.',isCloud?'Shared data lives in your Supabase project.':'This browser stores your preview edits.',`<p><strong>${esc(statusText)}</strong></p>${store.error?`<div class="error-box">${esc(store.error)}</div>`:''}<p>${isCloud?'When two organizers edit the same campus at once, the second save is paused to protect both sets of changes. Export your backup first, load the latest cloud plan, then reapply your changes.':'To save across computers and share editing, complete the Supabase and Vercel setup. This local preview does not send your data to a server.'}</p><div class="info-actions">${store.loaded?`<button class="btn" data-action="export-json">${icon('download')}Download both-campus backup</button>`:''}${isCloud&&store.loaded?`<button class="btn primary" data-action="retry-save" ${store.blocked?'disabled':''}>${icon('cloud')}Retry save now</button><button class="btn" data-action="reload-cloud">${icon('layers')}Load latest cloud plan</button>`:''}${campus&&store.recovery(campus)?`<button class="btn" data-action="recovery-export">${icon('download')}Download recovered local draft</button>`:''}</div><p>Browser drafts are a convenience. Keep a JSON backup before a major map change or event day.</p>`);}
function preparedDownload(result,label){const attachment=new Blob([result.blob],{type:'application/octet-stream'});const url=URL.createObjectURL(attachment);setTimeout(()=>URL.revokeObjectURL(url),600000);openModal('Your download is ready.',esc(result.name),`<p>Your file has been prepared. Use the button below to save it to your computer.</p><a class="btn primary full" style="text-decoration:none;margin:15px 0" href="${url}" download="${esc(result.name)}">${icon('download')}${label}</a><p class="muted">${result.name.endsWith('.html')?'This HTML file is an offline editor with both campus plans. Save a JSON backup to move its edits to Supabase.':'This PDF includes the clean campus map, area directory and event schedule. It can be printed on A4 landscape.'}</p>`);}

root.addEventListener('click',handleClick);modal.addEventListener('click',handleClick);
async function handleClick(event){
  const button=event.target.closest('[data-action]');if(button){event.preventDefault();const action=button.dataset.action,id=button.dataset.id;
    try{switch(action){
      case 'campus':choose(id);break;
      case 'home':if(formDirty&&!confirm('Discard the unsaved form?'))break;closeModal(true);campus=null;resetMap();render();break;
      case 'area':selected=id;tab='events';mode='select';render();break;
      case 'deselect':selected=null;mode='select';render();break;
      case 'view':view=id;mode='select';drawing=[];render();break;
      case 'category':category=id;render();break;
      case 'clear-date':date='';render();break;
      case 'detail-tab':tab=id;render();break;
      case 'title':openModal('Name your plan.','This title appears in the portal and PDF exports.',`<label class="field">Plan title<input name="title" required maxlength="120" value="${esc(current().title)}"></label>`,formButtons('Save title'),'title-form');break;
      case 'edit-area':areaModal();break;
      case 'room':roomModal();break;
      case 'edit-room':roomModal(id);break;
      case 'event':eventModal();break;
      case 'room-event':eventModal(null,id);break;
      case 'edit-event':eventModal(id);break;
      case 'delete-room':{const z=selectedZone();if(current().events.some(e=>e.roomId===id&&e.areaId===z.id))throw Error('Move or delete this room’s bookings before deleting the room.');if(confirm('Delete this room?'))change(()=>z.rooms=z.rooms.filter(r=>r.id!==id));break;}
      case 'delete-event':if(confirm('Delete this event from the schedule?')){change(d=>d.events=d.events.filter(e=>e.id!==id));closeModal(true);}break;
      case 'delete-area':{const z=selectedZone(),n=current().events.filter(e=>e.areaId===z.id).length;if(confirm(`Delete ${z.name}, its ${z.rooms.length} rooms and ${n} events? You can undo this change during this session.`)){change(d=>{d.events=d.events.filter(e=>e.areaId!==z.id);d.zones=d.zones.filter(a=>a.id!==z.id);});selected=null;render();}break;}
      case 'color':document.getElementById('area-color').value=id;formDirty=true;break;
      case 'draw':if(current().zones.length>=200)throw Error('This campus already has the maximum 200 areas.');view='map';mode='draw';drawing=[];selected=null;render();break;
      case 'draw-back':drawing.pop();render();break;
      case 'draw-finish':if(!validShape(drawing))throw Error('Click at least three distinct corners to make a visible area.');areaModal(clone(drawing));break;
      case 'select-mode':mode='select';drawing=[];render();break;
      case 'pan-mode':mode='pan';drawing=[];render();break;
      case 'shape':if(!selected)throw Error('Select an area first.');view='map';mode='edit';render();break;
      case 'undo':if(history[campus].length){store.records[campus].doc=history[campus].pop();store.changed(campus);mode='select';render();toast('Last edit undone.');}break;
      case 'reference':if(document.getElementById('offline-runtime'))throw Error('The offline HTML contains the clean vector maps. Use the deployed portal to compare the original images.');reference=!reference;render();break;
      case 'labels':labels=!labels;renderMap();break;
      case 'zoom-in':zoom=Math.min(5,zoom+.25);transformMap();break;
      case 'zoom-out':zoom=Math.max(.5,zoom-.25);transformMap();break;
      case 'fit':zoom=1;pan={x:0,y:0};transformMap();break;
      case 'exports':exportModal();break;
      case 'help':helpModal();break;
      case 'sync':syncModal();break;
      case 'close':closeModal();break;
      case 'export-json':download('AirNexus-backup.json',JSON.stringify({format:'airnexus-atlas-v1',exportedAt:new Date().toISOString(),campuses:store.snapshot()},null,2));toast('Both-campus backup downloaded.');break;
      case 'export-svg':download(`AirNexus-${campus}-map.svg`,svgMarkup(campus,current(),{date}),'image/svg+xml');toast('Clean vector map downloaded.');break;
      case 'export-pdf':button.disabled=true;button.querySelector('strong').textContent='Preparing your PDF…';preparedDownload(await exportPDF(campus,clone(current()),date),'Download PDF now');break;
      case 'export-html':preparedDownload(await offlineHTML(store.snapshot()),'Download editable HTML now');break;
      case 'import':{const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>previewImport(input.files[0]);input.click();break;}
      case 'confirm-import':{const docs=modalContext.imported;for(const [cid,doc] of Object.entries(docs)){history[cid].push(clone(store.doc(cid)));store.records[cid].doc=clone(doc);store.changed(cid);}selected=null;closeModal(true);render();toast('Backup restored. Check the save indicator.');break;}
      case 'retry-save':await store.flush();closeModal(true);toast('Saved in Supabase.');break;
      case 'reload-cloud':if(confirm('Download a backup first if needed. Replace this browser’s drafts with the latest cloud plans?')){if(store.inflight)await store.inflight.catch(()=>{});for(const [cid,r] of Object.entries(store.records)){if(r.dirty)store.archive(cid,r.doc);r.dirty=false;store.persist(cid);}await store.load();history={e9:[],h11:[]};selected=null;closeModal(true);render();toast('Latest cloud plan loaded. Previous drafts are in recovery.');}break;
      case 'recovery-export':{const recovered=store.recovery(campus);download(`AirNexus-${campus}-recovered.json`,JSON.stringify({format:'airnexus-atlas-v1',campuses:{[campus]:recovered.doc}},null,2));break;}
      case 'logout':if(store.isDirty()){await store.flush();if(store.isDirty())throw Error('Wait for your changes to save before signing out.');}await store.signOut();campus=null;render();break;
    }}catch(error){const el=document.getElementById('form-error');if(modal.open&&el)el.textContent=error.message;else toast(error.message);}return;
  }
  if(!campus||view!=='map')return;
  const viewport=event.target.closest('#map-viewport');if(!viewport||mode==='pan'||event.target.closest('[data-handle]'))return;
  if(mode==='draw'){if(drawing.length>=100)return toast('Maximum 100 corners per area.');drawing.push(mapPoint(event));render();return;}
  const shape=event.target.closest('[data-area]');if(shape){selected=shape.dataset.area;if(mode!=='edit')mode='select';tab='events';render();}
}
root.addEventListener('input',e=>{const field=e.target.dataset.input;if(field==='query'){query=e.target.value;render();}});
root.addEventListener('change',e=>{const field=e.target.dataset.input;if(field==='date'){date=e.target.value;render();}if(field==='area'){selected=e.target.value||null;render();}});
modal.addEventListener('input',()=>formDirty=true);
modal.addEventListener('change',e=>{if(e.target.id==='event-area')document.getElementById('event-room').innerHTML=roomOptions(e.target.value);});
modal.addEventListener('cancel',e=>{if(formDirty){e.preventDefault();closeModal();}});
modal.addEventListener('submit',handleSubmit);root.addEventListener('submit',handleSubmit);
async function handleSubmit(event){event.preventDefault();const form=event.target;if(!(form instanceof HTMLFormElement))return;const data=Object.fromEntries(new FormData(form));const errorEl=document.getElementById(form.id==='login-form'?'login-error':'form-error');if(errorEl)errorEl.textContent='';
  try{switch(form.id){
    case 'login-form':form.classList.add('loading');await store.signIn(data.email.trim(),data.password);form.querySelector('[name=password]').value='';render();break;
    case 'area-form':{const points=modalContext.points;if(!data.name.trim())throw Error('Enter an area name.');change(d=>{if(points){const z={id:uid(),name:data.name.trim(),category:data.category,color:data.color,verified:data.verified==='on',notes:data.notes.trim(),points,label:center(points),rooms:[]};d.zones.push(z);selected=z.id;}else Object.assign(selectedZone(),{name:data.name.trim(),category:data.category,color:data.color,verified:data.verified==='on',notes:data.notes.trim()});});mode='select';drawing=[];closeModal(true);render();break;}
    case 'room-form':{const z=selectedZone();if(!data.name.trim())throw Error('Enter a room name.');if(z.rooms.some(r=>r.id!==modalContext.roomId&&r.name.toLowerCase()===data.name.trim().toLowerCase()))throw Error('This area already has a room with that name.');if(!modalContext.roomId&&z.rooms.length>=200)throw Error('Maximum 200 rooms per area.');const capacity=data.capacity?Number(data.capacity):null;if(capacity!==null&&(!Number.isInteger(capacity)||capacity<1||capacity>100000))throw Error('Enter a valid room capacity.');if(capacity&&current().events.some(e=>e.roomId===modalContext.roomId&&e.status!=='Cancelled'&&e.attendees>capacity))throw Error('An existing booking exceeds this capacity. Update that booking first.');change(()=>{const r=z.rooms.find(r=>r.id===modalContext.roomId);if(r)Object.assign(r,{name:data.name.trim(),capacity});else z.rooms.push({id:uid(),name:data.name.trim(),capacity});});tab='rooms';closeModal(true);render();break;}
    case 'event-form':{if(!modalContext.eventId&&current().events.length>=10000)throw Error('Maximum 10,000 events per campus.');const e={id:modalContext.eventId||uid(),areaId:data.areaId,roomId:data.roomId||null,title:data.title.trim(),date:data.date,start:data.start,end:data.end,organizer:data.organizer.trim(),attendees:Number(data.attendees||0),status:data.status,notes:data.notes.trim()};validateEvent(current(),e);change(d=>{const n=d.events.findIndex(old=>old.id===e.id);if(n<0)d.events.push(e);else d.events[n]=e;selected=e.areaId;});closeModal(true);toast('Event saved.');break;}
    case 'title-form':if(!data.title.trim())throw Error('Enter a plan title.');change(d=>d.title=data.title.trim());closeModal(true);break;
  }}catch(error){if(errorEl)errorEl.textContent=error.message;else toast(error.message);}finally{form.classList.remove('loading');}
}
async function previewImport(file){try{if(!file)return;if(file.size>8*1024*1024)throw Error('Choose a backup smaller than 8 MB.');const data=JSON.parse(await file.text());if(data.format!=='airnexus-atlas-v1'||!data.campuses||typeof data.campuses!=='object')throw Error('Choose an AirNexus JSON backup.');const entries=Object.entries(data.campuses);if(!entries.length||entries.some(([id])=>!CAMPUSES[id]))throw Error('Backup has unsupported campuses.');for(const [id,doc] of entries)validateDocument(doc,id);modalContext={imported:data.campuses};openModal('Restore this backup?','The following campus plans will be replaced. Export a backup first if needed.',`<ul class="info-list">${entries.map(([id,d])=>`<li><strong>${CAMPUSES[id].name}</strong> · ${d.zones.length} areas, ${d.zones.reduce((n,z)=>n+z.rooms.length,0)} rooms, ${d.events.length} events</li>`).join('')}</ul><div class="info-note">Restored changes save to the active storage mode, shown at the top of the portal. Other campuses are kept as they are.</div>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="confirm-import">Restore these plans</button>`);}catch(error){toast(error.message);}}
function mapPoint(e){const svg=document.querySelector('#map-layer svg');const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const pos=p.matrixTransform(svg.getScreenCTM().inverse()),c=CAMPUSES[campus];return [Math.round(Math.max(0,Math.min(c.width,pos.x))*10)/10,Math.round(Math.max(0,Math.min(c.height,pos.y))*10)/10];}
root.addEventListener('pointerdown',e=>{if(!campus||!e.target.closest('#map-viewport'))return;if(e.target.dataset.handle!==undefined&&mode==='edit'){e.preventDefault();drag={type:'handle',handle:e.target.dataset.handle,before:clone(current()),id:selected,pointer:e.pointerId};}else if(mode==='pan'){e.preventDefault();drag={type:'pan',x:e.clientX,y:e.clientY,start:{...pan},pointer:e.pointerId};}});
window.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer)return;if(drag.type==='pan'){pan={x:drag.start.x+e.clientX-drag.x,y:drag.start.y+e.clientY-drag.y};transformMap();}else{const z=current().zones.find(z=>z.id===drag.id);if(!z)return;const p=mapPoint(e);if(drag.handle==='label')z.label=p;else z.points[Number(drag.handle)]=p;renderMap();}});
function endDrag(){if(!drag)return;if(drag.type==='handle'){if(validShape(selectedZone().points)){history[campus].push(drag.before);if(history[campus].length>30)history[campus].shift();store.changed(campus);}else{store.records[campus].doc=drag.before;toast('That would collapse the area. The previous shape was restored.');}render();}drag=null;}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
root.addEventListener('wheel',e=>{if(!e.target.closest('#map-viewport')||!e.ctrlKey)return;e.preventDefault();zoom=Math.max(.5,Math.min(5,zoom+(e.deltaY<0?.1:-.1)));transformMap();},{passive:false});
root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-area]')){e.preventDefault();selected=e.target.closest('[data-area]').dataset.area;render();}});
window.addEventListener('beforeunload',e=>{if(formDirty||store.isDirty()){e.preventDefault();e.returnValue='';}});
window.addEventListener('online',()=>{if(store.loaded&&store.cloud&&!store.blocked)store.flush().catch(()=>{});});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&store.loaded)store.flush().catch(()=>{});});
async function poll(){if(!store.cloud||!store.loaded||store.inflight||store.isDirty()||store.blocked||polling||modal.open||mode==='draw'||mode==='edit'||drag)return;polling=true;try{if(await store.refresh()){history={e9:[],h11:[]};render();}}catch(e){store.status('Cloud connection unavailable','error');}finally{polling=false;}}
setInterval(poll,20000);
async function init(){try{let snapshot=null;const snap=document.getElementById('snapshot');if(snap){snapshot=JSON.parse(snap.textContent);if(snapshot){let hash=2166136261;for(const c of snap.textContent)hash=Math.imul(hash^c.charCodeAt(0),16777619);store.scope='offline-'+(hash>>>0).toString(16);}}if(!store.cloud||store.session)await store.load(snapshot);render();}catch(e){store.loaded=false;renderLogin(e.message);}}
init();
</script>
</body>
</html>
